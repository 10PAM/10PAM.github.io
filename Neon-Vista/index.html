<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piceno - Neon Vista</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script src="../Buttons.js"></script>
    <script src="../Page_Scroll.js"></script>

    <style>
        ::selection {
            background: rgba(105, 0, 30, 0.99);
        }
        
        body 
        {
            font-size: 14px;
            background-color: rgb(0, 0, 0);
            overflow-y: scroll;
            text-align: center;
            vertical-align: middle;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);
        }
        
        .container{
            text-align: center;
            display: flex;
            flex-direction: column; /* Stacks elements vertically */
            align-items: center; /* Aligns text vertically */
            justify-content: center;
            align-content: center; /* Modern CSS: Vertically centers block elements */
            flex-wrap: wrap;
            font-family: Calibri, Candara, Segoe, Optima, Arial, sans-serif;
            width: 50%;
        }

        .Button_Projects_Container{
                display: flex;
                gap: 30px;
                flex-direction: row;
                align-items: center; /* Aligns text vertically */
                justify-content: center;
                flex-wrap: wrap;
                text-align: center;
                margin-top: 10px;
        }
        
        .Blog{
            font-size: 14px;
            width: 100%; 
            display: block; 
            text-align: center; 
            margin: auto;
        }
        
        .Button_Projects{
            color: #ffffff;
            outline: none;
            background-color: rgba(119, 20, 20, 0);
            border-color: #ffffff;
            border-radius: 2px;
            text-align: center;
            position: relative;
        }

        .Header_1{
            font-size: 18px;
            color: rgb(255, 255, 255);
            font-weight: normal;
        }

        .Header_2{
            font-size: 14px;
            color: rgb(255, 255, 255);
            font-weight: normal;
        }

        .Paragraph{
            text-align: left; 
            color: rgb(255, 255, 255);
        }

        .Button_Projects{
            color: #ffffff;
            outline: none;
            background-color: rgba(119, 20, 20, 0);
            border-color: #ffffff;
            border-radius: 2px;
            text-align: center;
            cursor: pointer;
            font-size: 18px;
            width: 210px; 
            height: 30px;
        }
        
        .Paragraph_Image{
            width: 350px;
            height: 200px;
            cursor: pointer; 
            -webkit-user-drag: none; 
        }

        .Sliced_Div{
            border-top: 4px solid #69001E;
            border-bottom: 4px solid #69001E;
        }

        @media (max-width: 1200px) {
            
            .Blog{
                font-size: 14px;
                width: 100%; 
            }
            
            .Button_Projects{
                color: #ffffff;
                outline: none;
                background-color: rgba(119, 20, 20, 0);
                border-color: #ffffff;
                border-radius: 2px;
                cursor: pointer;
                font-size: 12px; 
                width: 100px; 
                height: 35px;
            }

            .container{
                text-align: center;
                display: flex;
                flex-direction: column; /* Stacks elements vertically */
                align-items: center; /* Aligns text vertically */
                justify-content: center;
                align-content: center; /* Modern CSS: Vertically centers block elements */
                flex-wrap: wrap;
                font-family: Calibri, Candara, Segoe, Optima, Arial, sans-serif;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!--Blog 1 Start-->

        <section style="width: 100%">
            
            <h1 class="Header_1">Piceno - Neon Vista</h1>

            <div class="Sliced_Div">
                <br>
                <img class="Paragraph_Image" onclick="window.open('../Images/Blog/1/A.jpg')" src="../Images/Blog/1/A.jpg" alt="My Game Engine Progress" loading="lazy">
                        
                <p class="Paragraph">Neon vista is a mystery game that will empower the player to solve challenging yet fun objectives to unlock and progress through an endearing journey.</p>
                        
                <img class="Paragraph_Image" onclick="window.open('../Images/Blog/1/B.jpg')" src="../Images/Blog/1/B.jpg" alt="Computer Programming in OpenGL with C++">
        
                <p class="Paragraph">The game is currently under progress.</p>
            </div>
            
        </section>
                    
    </div>
    
    <div class="Button_Projects_Container">
        <button class="Button_Projects" onclick="window.open('https://piceno.dev/', '_self');">Main Page</button>
    </div>
        
</body>
</html>
