<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Effectiveness of Therapeutic-Oriented Software</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script src="../../../../Buttons.js"></script>
    <script src="../../../../Page_Scroll.js"></script>

    <style>
        ::selection {
            background: rgba(105, 0, 30, 0.99);
        }
        
        body 
        {
            font-size: 14px;
            background-color: rgb(0, 0, 0);
            overflow-y: scroll;
            text-align: center;
            vertical-align: middle;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);
        }
        
        .container{
            text-align: center;
            display: flex;
            flex-direction: column; /* Stacks elements vertically */
            align-items: center; /* Aligns text vertically */
            justify-content: center;
            align-content: center; /* Modern CSS: Vertically centers block elements */
            flex-wrap: wrap;
            font-family: Calibri, Candara, Segoe, Optima, Arial, sans-serif;
            width: 50%;
        }

        .Button_Projects_Container{
                display: flex;
                gap: 30px;
                flex-direction: row;
                align-items: center; /* Aligns text vertically */
                justify-content: center;
                flex-wrap: wrap;
                text-align: center;
                margin-top: 10px;
        }
        
        .Blog{
            font-size: 14px;
            width: 100%; 
            display: block; 
            text-align: center; 
            margin: auto;
        }
        
        .Button_Projects{
            color: #ffffff;
            outline: none;
            background-color: rgba(119, 20, 20, 0);
            border-color: #ffffff;
            border-radius: 2px;
            text-align: center;
            position: relative;
        }

        .Header_1{
            font-size: 18px;
            color: rgb(255, 255, 255);
            font-weight: normal;
        }

        .Header_2{
            font-size: 14px;
            color: rgb(255, 255, 255);
            font-weight: normal;
        }

        .Paragraph{
            text-align: left; 
            color: rgb(255, 255, 255);
        }

        .Button_Projects{
            color: #ffffff;
            outline: none;
            background-color: rgba(119, 20, 20, 0);
            border-color: #ffffff;
            border-radius: 2px;
            text-align: center;
            cursor: pointer;
            font-size: 18px;
            width: 210px; 
            height: 30px;
        }
        
        .Paragraph_Image{
            width: 350px;
            height: 200px;
            cursor: pointer; 
            -webkit-user-drag: none; 
        }

        .Sliced_Div{
            border-top: 4px solid #69001E;
            border-bottom: 4px solid #69001E;
            width: 100%;
        }

        .PDF_Embed{
            width: 100%;
            height: 800px;
        }

        @media (max-width: 1200px) {
            
            .Blog{
                font-size: 14px;
                width: 100%; 
            }
            
            .Button_Projects{
                color: #ffffff;
                outline: none;
                background-color: rgba(119, 20, 20, 0);
                border-color: #ffffff;
                border-radius: 2px;
                cursor: pointer;
                font-size: 12px; 
                width: 100px; 
                height: 35px;
            }

            .container{
                text-align: center;
                display: flex;
                flex-direction: column; /* Stacks elements vertically */
                align-items: center; /* Aligns text vertically */
                justify-content: center;
                align-content: center; /* Modern CSS: Vertically centers block elements */
                flex-wrap: wrap;
                font-family: Calibri, Candara, Segoe, Optima, Arial, sans-serif;
                width: 100%;
            }

            .PDF_Embed{
                width: 95%;
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section style="width: 100%">
            <h1 class="Header_1">Effectiveness of Therapeutic-Oriented Software</h1>
            <h2 class="Header_2">Author: Mario Aguilera Piceno</h2>

            <div class="Sliced_Div">
                <br>
                <object class="PDF_Embed" data="./../../Documents/Research/1.pdf" type="application/pdf">
                    <p>Your browser does not support embedded PDFs. 
                       <a href="./../../Documents/Research/1.pdf">Download the PDF instead</a>.
                    </p>
                </object>
                <br>
            </div>
                    
        </section>
        
    </div>

    <div class="Button_Projects_Container">
        <button class="Button_Projects" onclick="window.open('https://piceno.dev/mario', '_self');">Main Page</button>
        <button class="Button_Projects" onclick="window.open('https://www.linkedin.com/in/mario-aguilera-piceno', '_self');">LinkedIn</button>
    </div>
    
</body>
</html>
